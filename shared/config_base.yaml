# shared/config_base.yaml
# Config commune à toutes les APIs — chaque config/{API}.yaml surcharge uniquement
# ce qui change (fusion profonde, voir shared/config.py::load_config).

pipeline_version: "1.0.0"

input:
  type:     "sqlserver"
  sep:      ";"
  encoding: "utf-8-sig"
  sheet:    0

output:
  format: "csv"

llm:
  model:       "claude-sonnet-5"
  batch_size:  20
  max_retry:   3
  retry_wait:  2

reports:
  # Nombre max de valeurs outliers détaillées PAR CHAMP dans le rapport PDF
  # (section "Détail des outliers par champ"). 0 = aucune limite, tout est
  # listé. Garde-fou contre un PDF de plusieurs centaines de pages lors d'un
  # Initial Load remontant des milliers d'outliers ; la liste exhaustive reste
  # de toute façon dans le classeur Excel de classification.
  top_n_outliers_detail: 100

email:
  enabled: true
  attach_workbook_max_mb: 15
