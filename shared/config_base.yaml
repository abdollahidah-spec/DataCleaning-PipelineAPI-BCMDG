# shared/config_base.yaml
# Config commune à toutes les APIs — chaque config/{API}.yaml surcharge uniquement
# ce qui change (fusion profonde, voir shared/config.py::load_config).

pipeline_version: "1.0.0"

input:
  type:     "sqlserver"
  sep:      ";"
  encoding: "utf-8-sig"
  sheet:    0

load:
  # Lecture par paquets : donne une progression dans les logs pendant un
  # chargement long, au lieu d'un silence total (problème constaté sur l'Initial
  # Load d'E09). 0 / vide = lecture en un seul bloc, comme avant.
  chunk_size: 50000
  # Borne l'Initial Load à partir de cette date (AAAA-MM-JJ) au lieu de
  # rapatrier tout l'historique. Vide = tout l'historique.
  initial_since:

output:
  format: "csv"

llm:
  model:       "claude-sonnet-5"
  batch_size:  20
  max_retry:   3
  retry_wait:  2

reports:
  # Nombre max de valeurs outliers détaillées PAR CHAMP dans le rapport PDF
  # (section "Détail des outliers par champ"). 0 = aucune limite, tout est
  # listé. Garde-fou contre un PDF de plusieurs centaines de pages lors d'un
  # Initial Load remontant des milliers d'outliers ; la liste exhaustive reste
  # de toute façon dans le classeur Excel de classification.
  top_n_outliers_detail: 100
  # Nombre max de lignes d'anomalies écrites dans un onglet Excel. Au-delà,
  # l'onglet garde cet extrait et le détail INTÉGRAL part dans un CSV à côté du
  # classeur (aucune donnée perdue). Motif : l'écriture Excel coûte ~2 min par
  # 2,4 M cellules quel que soit le moteur (mesuré), et un onglet de plusieurs
  # millions de lignes dépasse la limite d'Excel tout en étant inexploitable.
  # 0 = aucune limite.
  max_anomaly_rows_excel: 200000

email:
  enabled: true
  attach_workbook_max_mb: 15
