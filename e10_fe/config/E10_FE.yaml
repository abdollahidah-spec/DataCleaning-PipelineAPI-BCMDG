# e10_fe/config/E10_FE.yaml
# Config de la pipeline E10_FE (Flux Entrants) — fusionnée avec shared/config_base.yaml.
# À lancer depuis la racine du repo (chemins relatifs résolus depuis là).
#
# Colonnes réelles de E10EtatBcmFluxEntrants (schéma relevé en base le 2026-09-17) :
#   Id, Banque, ReferenceTransaction, DateTransaction, TypeSwfit, ModeReglement, Devise,
#   MontantTransaction, TauxDeChange, NomDonneurOrdre, NifNni, Beneficiaire, Produit,
#   NatureEconomique, Pays, FkId, RefBanque, dtCr, idSysLog, fkidSyncOperation
#
# ⚠ Pas de colonne SourceDevise dans cette table (contrairement à E07 et au ticket) :
#   elle est donc absente du gabarit « sans activité » ci-dessous.
#
# Rôle de chaque colonne :
#   Normalisées (7)   : TypeSwfit, ModeReglement, Devise, NomDonneurOrdre,
#                       Beneficiaire, NatureEconomique, Pays
#   Validées          : MontantTransaction, TauxDeChange, DateTransaction
#   Conservées        : ReferenceTransaction (témoin NA), NifNni (matching DGI du
#                       bénéficiaire), RefBanque (= champ « banque » du ticket)
#   Hors périmètre    : Produit (décision métier, pour l'instant) ; Id, Banque, FkId,
#                       idSysLog, fkidSyncOperation (techniques / libellés)
#
# Flux ENTRANTS : le donneur d'ordre est étranger (Claude + recherche web), le
# bénéficiaire est local (matching base fiscale DGI) — l'inverse d'E07.
# Beneficiaire nécessite DGI_BASE_PATH / PUBLIC_ENT_PATH dans .env.

api_id: "E10_FE"

input:
  type: "sqlserver"
  table_name: "E10EtatBcmFluxEntrants"
  dt_cr_column: "dtCr"

load:
  mode: "auto"   # auto | initial | incremental
  # Historique limité aux données créées depuis le 01/01/2024 (dtCr >= 2024-01-01),
  # comme E09 — les lignes de 2023 ne sont pas traitées.
  initial_since: 2024-01-01
  # Lancer `--mode initial` manuellement une première fois AVANT d'activer le
  # Task Scheduler, pour que le premier run automatisé soit un vrai Incremental Load.

columns:
  ref_banque: "RefBanque"

outlier_tag: "OUTLIER"

# RÈGLE NA (shared/na_rule.py) — témoin ReferenceTransaction pour tous les champs
# catégoriels :
#   Champ == 'NA' ET ReferenceTransaction == 'NA' -> 'NA' (message sans activité)
#   Champ == 'NA' ET ReferenceTransaction != 'NA' -> OUTLIER (NA suspecte)
#   Champ vide / NULL                               -> OUTLIER
fields:
  - name: "TypeSwift"
    type: "categorical"
    columns:
      field: "TypeSwfit"               # orthographe du schéma BCM — c'est le vrai nom
      field_out: "TypeSwift_Normalisé"
      ref_transaction: "ReferenceTransaction"
      ref_banque: "RefBanque"
    flux: "FE"                          # codes SWIFT valides des Flux Entrants (pacs.004 inclus)
    outlier_tag: "OUTLIER"
    referentiel_path: "e10_fe/referentiel/typeswift_referentiel.json"

  - name: "ModeReglement"
    type: "categorical"
    columns:
      field: "ModeReglement"
      field_out: "ModeReglement_Normalisé"
      ref_transaction: "ReferenceTransaction"
      ref_banque: "RefBanque"
    outlier_tag: "OUTLIER"
    referentiel_path: "e10_fe/referentiel/mode_reglement_referentiel.json"

  - name: "Devise"
    type: "categorical"
    columns:
      field: "Devise"
      field_out: "Devise_Normalisée"
      ref_transaction: "ReferenceTransaction"
      ref_banque: "RefBanque"
    outlier_tag: "OUTLIER"
    referentiel_path: "e10_fe/referentiel/devise_referentiel.json"

  - name: "NomDonneurOrdre"
    type: "categorical"
    columns:
      field: "NomDonneurOrdre"
      field_out: "NomDonneurOrdre_Normalisé"
      ref_transaction: "ReferenceTransaction"
      ref_banque: "RefBanque"
    outlier_tag: "OUTLIER"
    referentiel_path: "e10_fe/referentiel/nomdonneurordre_referentiel_E10.json"
    llm:                          # valeurs de l'ancien repo pour E10
      model: "claude-sonnet-5"
      batch_size: 35
      max_retry: 3
      retry_wait: 2
      web_search_max_uses: 3      # outil serveur Claude, facturé à l'usage

  - name: "Beneficiaire"
    type: "categorical"
    columns:
      field: "Beneficiaire"
      field_out: "Beneficiaire_Normalisé"
      ref_transaction: "ReferenceTransaction"
      ref_banque: "RefBanque"
      nif_nni: "NifNni"           # matching DGI par NIF exact
    outlier_tag: "OUTLIER"
    referentiel_path: "e10_fe/referentiel/beneficiaire_referentiel_E10.json"
    matching:                     # seuils de l'ancien repo pour E10
      strong_threshold: 92
      strong_gap: 8
      arbitrage_min: 70
      batch_size: 300
    llm:
      model: "claude-sonnet-5"
      batch_size: 35              # lots d'arbitrage Claude — valeur de l'ancien repo pour E10
      max_retry: 3
      retry_wait: 2

  - name: "NatureEconomique"
    type: "categorical"
    columns:
      field: "NatureEconomique"
      field_out: "NatureEconomique_Normalisé"
      ref_transaction: "ReferenceTransaction"
      ref_banque: "RefBanque"
    outlier_tag: "OUTLIER"
    # Référentiel Flux Entrants de l'ancien repo + mapping direct FE ; Claude sur
    # liste FERMÉE de labels (remplace l'embedding mpnet de l'ancien repo, comme E07).
    referentiel_path: "e10_fe/referentiel/nature_economique_referentiel_E10.json"
    llm:
      model: "claude-sonnet-5"
      batch_size: 20
      max_retry: 3
      retry_wait: 2

  - name: "Pays"
    type: "categorical"
    columns:
      field: "Pays"
      field_out: "Pays_Normalisé"
      ref_transaction: "ReferenceTransaction"
      ref_banque: "RefBanque"
    outlier_tag: "OUTLIER"
    referentiel_path: "e10_fe/referentiel/pays_addr_keywords.json"
    llm:
      model: "claude-sonnet-5"
      batch_size: 25
      max_retry: 3
      retry_wait: 2

  - name: "Transactions"
    type: "transaction_validation"
    columns:
      montant_transaction: "MontantTransaction"
      taux_de_change: "TauxDeChange"
      date_transaction: "DateTransaction"
      dt_cr: "dtCr"
      ref_banque: "RefBanque"
      reference_transaction: "ReferenceTransaction"
      pays: "Pays"
    # Ticket : « dateTransaction < dtCr » — strict (même jour = anomalie), comme E07.
    date_inclusive: false
    # Gabarit « sans activité » du ticket : message dont ReferenceTransaction = NA.
    no_activity:
      template_na_columns:
        - "TypeSwfit"
        - "ModeReglement"
        - "Devise"
        - "NomDonneurOrdre"
        - "NifNni"
        - "Beneficiaire"
        - "Produit"               # lu pour le contrôle uniquement — jamais normalisé
        - "NatureEconomique"
      pays_value: "NoAs"

output:
  local_dir: "e10_fe/outputs/"
  classification_path: "PowerBI/E10_FE/E10_FE_classification.xlsx"

email:
  enabled: true
  attach_workbook_max_mb: 15
  # Libellé utilisé tel quel dans le sujet/corps de l'email (même gabarit que
  # E11/E09/E08/E07, validé par le Business Analyst) — ex: "Pipeline E10 – FE : ...".
  display_name: "E10 – FE"

schedule:   # métadonnées uniquement — non lues par le pipeline
  frequency: "weekly"
  day: "monday"
  time: "10:00"
  timezone: "Africa/Nouakchott"
